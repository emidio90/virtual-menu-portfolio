name: Verify and deploy portfolio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_MODE: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  firebase-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
  deploy-demo:
    name: Deploy isolated demo to Firebase Hosting
    needs: [checks, firebase-emulators]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'emidio90/virtual-menu-portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: firebase-hosting-virtual-menu-portfolio
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      VITE_APP_MODE: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify static-only deployment boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const cfg = JSON.parse(readFileSync('firebase.hosting.json', 'utf8'));
          assert.deepEqual(Object.keys(cfg), ['hosting']);
          assert.equal(cfg.hosting.public, 'dist');
          assert.deepEqual(cfg.hosting.predeploy, ['npm run build:demo']);
          assert.deepEqual(cfg.hosting.rewrites, [{source: '**', destination: '/index.html'}]);
          assert.equal(cfg.hosting.source, undefined);
          assert.equal(cfg.hosting.postdeploy, undefined);
          NODE
      - name: Do not replace a newer main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this older deployment is skipped.'
          fi
      - name: Authenticate with short-lived Google credentials
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: virtual-menu-portfolio
          workload_identity_provider: projects/957417739991/locations/global/workloadIdentityPools/github-hosting-demo/providers/github
          service_account: github-hosting-demo@virtual-menu-portfolio.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Rebuild and deploy demo only
        if: steps.current.outputs.deploy == 'true'
        run: >-
          npx --no-install firebase deploy
          --project virtual-menu-portfolio
          --config firebase.hosting.json
          --only hosting
          --non-interactive
          --message "GitHub main commit $GITHUB_SHA"
      - name: Verify published HTML matches this build
        if: steps.current.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            -H 'Cache-Control: no-cache' \
            "https://virtual-menu-portfolio.web.app/?ci=$GITHUB_SHA" \
            --output "$RUNNER_TEMP/deployed-index.html"
          cmp --silent dist/index.html "$RUNNER_TEMP/deployed-index.html"
          echo 'Published HTML matches the demo build for this commit.'
